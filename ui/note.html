<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Note</title>
<style>
  :root { --c: #a3a8b3; --a: .94; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #eceef1; -webkit-font-smoothing: antialiased; }
  .note { position: absolute; inset: 0; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden;
    background: color-mix(in srgb, color-mix(in srgb, var(--c) 14%, #15161a) calc(var(--a) * 100%), transparent);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
  .head { flex: none; display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 10px; cursor: grab; }
  .head .bar { flex: 1; height: 100%; }
  .grip { width: 26px; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--c) 70%, transparent); pointer-events: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; width: 26px; height: 24px; display: grid; place-items: center; border-radius: 7px; color: #9aa0ab; opacity: 0; transition: opacity .15s, background .15s; }
  body:hover button, body:focus-within button { opacity: 1; }
  button:hover { background: rgba(255,255,255,.1); color: #fff; }
  button.on { color: var(--c); opacity: 1; }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .menu { position: absolute; top: 30px; right: 6px; z-index: 2; display: none; flex-direction: column; gap: 8px; padding: 10px; border-radius: 10px; background: #1d1e23; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  .menu.open { display: flex; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; }
  .dots i.on { box-shadow: 0 0 0 2px #1d1e23, 0 0 0 3.5px #fff; }
  input[type=range] { width: 132px; accent-color: var(--c); }
  textarea { flex: 1; width: 100%; padding: 2px 14px 14px; resize: none; border: 0; outline: none; background: none; color: inherit; font: inherit; user-select: text; }
  textarea::placeholder { color: rgba(236,238,241,.35); }
  .list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 2px 4px; }
  .item i { flex: none; width: 15px; height: 15px; margin-top: 3px; border-radius: 4px; border: 1.5px solid color-mix(in srgb, var(--c) 80%, transparent); cursor: pointer; display: grid; place-items: center; }
  .item.done i { background: var(--c); }
  .item.done i::after { content: ""; width: 7px; height: 4px; margin-top: -2px; border: solid #15161a; border-width: 0 0 2px 2px; transform: rotate(-45deg); }
  .item input { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: inherit; font: inherit; user-select: text; }
  .item.done input { text-decoration: line-through; opacity: .5; }
  ::-webkit-scrollbar { display: none; }
  .rs { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; }
  .rs::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 6px; height: 6px; border: solid color-mix(in srgb, var(--c) 60%, transparent); border-width: 0 2px 2px 0; border-radius: 0 0 2px 0; opacity: 0; transition: opacity .15s; }
  body:hover .rs::after { opacity: 1; }
  body.ghost .head button, body.ghost .rs, body.ghost .menu { display: none; }
</style>
</head>
<body>
<div class="note">
  <div class="head" data-tauri-drag-region>
    <div class="bar" data-tauri-drag-region><div class="grip" style="margin-top:13px"></div></div>
    <button id="b-list" title="Checklist"><svg viewBox="0 0 24 24"><path d="m4 7 2 2 3-3M4 15l2 2 3-3M12 7.5h8M12 15.5h8"/></svg></button>
    <button id="b-menu" title="Color and opacity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 0 0 15z" fill="currentColor"/></svg></button>
    <button id="b-hide" title="Hide (it stays in the app)"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="menu" id="menu"><div class="dots" id="dots"></div><input type="range" id="op" min="0.35" max="1" step="0.01" title="Opacity"></div>
  <textarea id="text" spellcheck="false" placeholder="Write something …"></textarea>
  <div class="list" id="list" hidden></div>
  <div class="rs" id="rs"></div>
</div>
<script src="i18n.js"></script>
<script>
  const T = window.__TAURI__, win = T.window.getCurrentWindow();
  const id = new URLSearchParams(location.search).get("id");
  const COL = { graphite: "#a3a8b3", amber: "#f2c14e", mint: "#6fd6a8", sky: "#6cb6ff", rose: "#ff8fab", violet: "#b49cff" };
  const $ = (s) => document.querySelector(s);
  let n = null, t = null;
  const save = (patch, wait) => {
    Object.assign(n, patch);
    clearTimeout(t);
    const go = () => T.core.invoke("note_save", { id, patch }).catch(console.error);
    wait ? (t = setTimeout(go, 400)) : go();
  };
  function look() {
    document.documentElement.style.setProperty("--c", COL[n.color] || COL.graphite);
    document.documentElement.style.setProperty("--a", n.opacity);
    $("#dots").innerHTML = Object.entries(COL).map(([k, c]) => `<i data-c="${k}" class="${k === n.color ? "on" : ""}" style="background:${c}"></i>`).join("");
    $("#dots").querySelectorAll("i").forEach((d) => (d.onclick = () => { save({ color: d.dataset.c }); look(); }));
    if (document.activeElement !== $("#op")) $("#op").value = n.opacity;
    $("#b-list").classList.toggle("on", n.list);
    $("#text").hidden = n.list; $("#list").hidden = !n.list;
  }
  function render(force) {
    look();
    if (!n.list) { if (force || document.activeElement !== $("#text")) $("#text").value = n.text; return; }
    if (!force && $("#list").contains(document.activeElement)) return;
    const lines = n.text.split("\n");
    if (!lines.length || lines.at(-1) !== "") lines.push("");
    $("#list").innerHTML = "";
    lines.forEach((l) => addItem(l));
  }
  // checklist lines are stored as "[ ] text" / "[x] text", so the text view still makes sense
  function listText() {
    return [...$("#list").children].map((r) => (r.querySelector("input").value || r.classList.contains("done") ? (r.classList.contains("done") ? "[x] " : "[ ] ") + r.querySelector("input").value : "")).join("\n").replace(/\n+$/, "");
  }
  function addItem(line, after) {
    const m = line.match(/^\[( |x)\] ?(.*)$/);
    const r = document.createElement("div");
    r.className = "item" + (m?.[1] === "x" ? " done" : "");
    r.innerHTML = `<i></i><input spellcheck="false">`;
    const inp = r.querySelector("input");
    inp.value = m ? m[2] : line;
    r.querySelector("i").onclick = () => { r.classList.toggle("done"); save({ text: listText() }); };
    inp.oninput = () => save({ text: listText() }, true);
    inp.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); addItem("", r).querySelector("input").focus(); save({ text: listText() }, true); }
      if (e.key === "Backspace" && !inp.value && $("#list").children.length > 1) { e.preventDefault(); const p = r.previousElementSibling || r.nextElementSibling; r.remove(); p.querySelector("input").focus(); save({ text: listText() }, true); }
      if (e.key === "ArrowUp") r.previousElementSibling?.querySelector("input").focus();
      if (e.key === "ArrowDown") r.nextElementSibling?.querySelector("input").focus();
    };
    after ? after.after(r) : $("#list").append(r);
    return r;
  }
  $("#text").oninput = () => save({ text: $("#text").value }, true);
  $("#b-list").onclick = () => {
    const on = !n.list;
    let text = n.text;
    if (on) text = text.split("\n").map((l) => (l && !/^\[( |x)\]/.test(l) ? "[ ] " + l : l)).join("\n");
    else text = text.replace(/^\[( |x)\] ?/gm, "");
    save({ list: on, text }); render(true);
  };
  $("#b-menu").onclick = () => $("#menu").classList.toggle("open");
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu, #b-menu")) $("#menu").classList.remove("open"); });
  $("#op").oninput = (e) => { n.opacity = +e.target.value; look(); save({ opacity: n.opacity }, true); };
  $("#b-hide").onclick = () => save({ shown: false });
  $("#rs").onpointerdown = (e) => { e.preventDefault(); win.startResizeDragging("SouthEast"); };
  T.event.listen("note", ({ payload }) => { if (payload.id !== id) return; const listChanged = n && payload.list !== n.list; n = payload; render(listChanged); });
  T.event.listen("ghost", ({ payload }) => document.body.classList.toggle("ghost", payload));
  T.core.invoke("note_get", { id }).then((x) => { if (!x) return; n = x; render(true); if (!n.text) $("#text").focus(); });
  T.core.invoke("notes_list").then((s) => document.body.classList.toggle("ghost", s.ghost)).catch(() => {});
</script>
</body>
</html>
